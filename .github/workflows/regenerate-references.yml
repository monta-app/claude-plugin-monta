name: Regenerate references

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-references

jobs:
  regenerate:
    name: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate the references from the Monta API and Monta Public API specs
        run: npm run generate
      - name: Detect changes
        id: changes
        run: |
          changed() { [ -n "$(git status --porcelain "$1")" ] && echo true || echo false; }
          partner=$(changed skills/)
          public=$(changed plugins/monta-public-api/skills/)
          {
            echo "partner=$partner"
            echo "public=$public"
          } >> "$GITHUB_OUTPUT"
          if [ "$partner" = false ] && [ "$public" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The references already match the Monta API and Monta Public API specs, no PR to open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check a sample of docs links
        if: steps.changes.outputs.changed == 'true'
        # developer.monta.com and docs.public-api.monta.com serve the old docs until the portal cutover, so check the same paths on the staging hosts
        run: |
          for refs in skills/monta-api/references plugins/monta-public-api/skills/monta-public-api/references; do
            grep -rohE 'https://(developer|docs\.public-api)\.monta\.com/[^)[:space:]]*[^).[:space:]]' "$refs" | sort -u | shuf -n 5
          done \
            | sed -E 's#^https://(developer|docs\.public-api)\.monta\.com/#https://\1.staging.monta.com/#' \
            | while read -r url; do
                curl -fsSIL --retry 3 -o /dev/null -w "%{http_code} $url\n" "$url"
              done
      - name: Bump the version and add a changelog entry for each plugin whose references changed
        if: steps.changes.outputs.changed == 'true'
        env:
          PARTNER_CHANGED: ${{ steps.changes.outputs.partner }}
          PUBLIC_CHANGED: ${{ steps.changes.outputs.public }}
        run: |
          if [ "$PARTNER_CHANGED" = true ]; then node scripts/bump-plugin.mjs . "Monta API"; fi
          if [ "$PUBLIC_CHANGED" = true ]; then node scripts/bump-plugin.mjs plugins/monta-public-api "Monta Public API"; fi
      - name: Open or update the references PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.MONTA_BOT_TOKEN }}
          branch: bot/regenerate-references
          delete-branch: true
          add-paths: |
            skills/monta-api/references
            .claude-plugin/plugin.json
            CHANGELOG.md
            plugins/monta-public-api/skills/monta-public-api/references
            plugins/monta-public-api/.claude-plugin/plugin.json
            plugins/monta-public-api/CHANGELOG.md
          commit-message: Regenerate the Monta API and Monta Public API references from the OpenAPI specs
          title: Regenerate the Monta API and Monta Public API references from the OpenAPI specs
          body: |
            The endpoint, deprecation and schema references were regenerated after a spec change: the `monta` plugin's from the Monta API OpenAPI specs (v1 and v2), and the `monta-public-api` plugin's from the Monta Public API OpenAPI spec. Each plugin whose references changed got a patch version bump and a changelog entry.

            A human needs to review this before merging: check that new or changed operations have the right safety class (`scripts/safety.mjs` lists the destructive operations that are not DELETE requests) and that the deprecation notes still name the right replacements.
